name: Market Analysis Development Tests
on:
  push:
    branches: [dev/market-analysis-seven-sections]
  pull_request:
    paths:
      - 'lib/market-analysis-math.js'
      - 'market-analysis-v2.js'
      - 'test/**'
      - '.github/workflows/market-analysis-tests.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: node --test test/market-analysis-math.test.js
      - run: node --check market-analysis-v2.js
      - run: node --check market-analysis-api.js
      - run: node --check market-analysis-extended.js
      - run: node --check public/market-analysis.js
