name: Add SENSEX support

on:
  workflow_dispatch:
  push:
    paths:
      - 'server.js'
      - '.github/workflows/add-sensex.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch server.js
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('server.js')
          s=p.read_text()
          old='const price={success:true,nifty:null,niftyChange:null,banknifty:null,bankniftyChange:null,finnifty:null,finniftyChange:null,vix:null,vixChange:null,updated:null,source:"nse"};'
          new='const price={success:true,nifty:null,niftyChange:null,banknifty:null,bankniftyChange:null,finnifty:null,finniftyChange:null,vix:null,vixChange:null,sensex:null,sensexChange:null,updated:null,source:"nse"};'
          s=s.replace(old,new)
          old='vix:["INDIA VIX","INDIA VIX INDEX"]'
          new='vix:["INDIA VIX","INDIA VIX INDEX"],sensex:["SENSEX","BSE SENSEX","S&P BSE SENSEX","BSE SENSEX 30"]'
          s=s.replace(old,new)
          old='const yahooMap={nifty:"^NSEI",banknifty:"^NSEBANK",vix:"^INDIAVIX"};'
          new='const yahooMap={nifty:"^NSEI",banknifty:"^NSEBANK",vix:"^INDIAVIX",sensex:"^BSESN"};'
          s=s.replace(old,new)
          old='console.log("STRIKE PULSE PRICES:",price.nifty,price.banknifty,price.finnifty,price.vix);'
          new='console.log("STRIKE PULSE PRICES:",price.nifty,price.banknifty,price.finnifty,price.vix,price.sensex);'
          s=s.replace(old,new)
          old='if(!price.nifty||!price.banknifty||!price.finnifty||!price.vix)await updatePrices();'
          new='if(!price.nifty||!price.banknifty||!price.finnifty||!price.vix||!price.sensex)await updatePrices();'
          s=s.replace(old,new)
          old='vix:{price:price.vix,change:price.vixChange}}});});'
          new='vix:{price:price.vix,change:price.vixChange},sensex:{price:price.sensex,change:price.sensexChange}}});});'
          s=s.replace(old,new)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.js
          git diff --cached --quiet || git commit -m 'Add SENSEX to prices API'
          git push