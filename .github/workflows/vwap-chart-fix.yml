name: VWAP chart fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch VWAP backend and main JS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('server.js')
          s=p.read_text()
          old='''async function yahooIntraday(symbol="^NSEI"){const r=await fetch(YAHOO+"/v8/finance/chart/"+encodeURIComponent(symbol)+"?range=1d&interval=5m",{headers:{"User-Agent":HEADERS["User-Agent"]}});if(!r.ok)throw Error(`Yahoo intraday HTTP ${r.status}`);const body=await r.json();const result=body?.chart?.result?.[0],q=result?.indicators?.quote?.[0];if(!q)throw Error("Yahoo intraday data unavailable");const ts=result.timestamp||[],high=q.high||[],low=q.low||[],close=q.close||[];const points=[];let sum=0,count=0;for(let i=0;i<Math.min(ts.length,high.length,low.length,close.length);i++){const h=num(high[i]),l=num(low[i]),x=num(close[i]);if(h==null||l==null||x==null)continue;const typical=(h+l+x)/3;sum+=typical;count++;points.push({t:ts[i]*1000,price:x,vwap:sum/count});}if(!points.length)throw Error("No valid intraday points");return {vwap:points[points.length-1].vwap,spot:points[points.length-1].price,points};}'''
          new='''async function yahooIntraday(symbol="^NSEI"){const r=await fetch(YAHOO+"/v8/finance/chart/"+encodeURIComponent(symbol)+"?range=1d&interval=5m",{headers:{"User-Agent":HEADERS["User-Agent"]}});if(!r.ok)throw Error(`Yahoo intraday HTTP ${r.status}`);const body=await r.json();const result=body?.chart?.result?.[0],q=result?.indicators?.quote?.[0];if(!q)throw Error("Yahoo intraday data unavailable");const ts=result.timestamp||[],high=q.high||[],low=q.low||[],close=q.close||[],volume=q.volume||[];const points=[];let pv=0,vol=0;for(let i=0;i<Math.min(ts.length,high.length,low.length,close.length);i++){const h=num(high[i]),l=num(low[i]),x=num(close[i]),v=num(volume[i]);if(h==null||l==null||x==null||v==null||v<=0)continue;const typical=(h+l+x)/3;pv+=typical*v;vol+=v;points.push({t:ts[i]*1000,price:x,vwap:pv/vol,volume:v});}if(!points.length)throw Error("No valid intraday points");return {vwap:points[points.length-1].vwap,spot:points[points.length-1].price,points};}'''
          if old not in s: raise SystemExit('expected yahooIntraday block not found')
          s=s.replace(old,new,1)
          old2='''const symbol=String(req.query.symbol||"NIFTY").toUpperCase(),yahooSymbol=symbol==="NIFTY"?"^NSEI":symbol==="BANKNIFTY"?"^NSEBANK":symbol;'''
          new2='''const symbol=String(req.query.symbol||"NIFTY").toUpperCase(),yahooSymbol=symbol==="NIFTY"?"^NSEI":symbol==="BANKNIFTY"?"^NSEBANK":symbol==="FINNIFTY"?"^CNXFIN":symbol==="MIDCPNIFTY"?"^NSEMDCP50":symbol==="SENSEX"?"^BSESN":symbol;'''
          if old2 not in s: raise SystemExit('expected VWAP symbol mapping not found')
          s=s.replace(old2,new2,1)
          p.write_text(s)

          p=Path('strike-pulse.js')
          s=p.read_text()
          marker='''/* Strike Pulse — Global VWAP chart layer */'''
          if marker not in s:
            s += r'''

/* Strike Pulse — Global VWAP chart layer */
(function(){
'use strict';
if(window.__StrikePulseVWAPChartLoaded)return;
window.__StrikePulseVWAPChartLoaded=true;
var API='https://strike-pulse-relay.onrender.com/api';
var lastSymbol='';
function el(id){return document.getElementById(id)}
function symbol(){
 var e=el('spSelectedSymbol');
 if(e&&e.textContent.trim())return e.textContent.trim().toUpperCase().replace(/\s+/g,'');
 var a=document.querySelector('.sp-symbol-btn.active');
 return a?(a.getAttribute('data-symbol')||a.textContent||'NIFTY').toUpperCase().replace(/\s+/g,''):'NIFTY';
}
function draw(points){
 var priceLine=el('spVwapPriceLine'),vwapLine=el('spVwapLine'),msg=el('spVwapChartMessage');
 if(!priceLine||!vwapLine||!points||points.length<2)return;
 var vals=[];
 points.forEach(function(p){if(Number.isFinite(+p.price)&&Number.isFinite(+p.vwap)){vals.push(+p.price,+p.vwap)}});
 if(vals.length<4)return;
 var mn=Math.min.apply(Math,vals),mx=Math.max.apply(Math,vals),range=(mx-mn)||1;
 function xy(i,v){return (30+(i/(points.length-1))*940).toFixed(1)+','+(280-((v-mn)/range)*250).toFixed(1)}
 priceLine.setAttribute('points',points.map(function(p,i){return xy(i,+p.price)}).join(' '));
 vwapLine.setAttribute('points',points.map(function(p,i){return xy(i,+p.vwap)}).join(' '));
 if(msg)msg.style.display='none';
}
async function load(){
 var s=symbol();
 if(!s)return;
 try{
  var r=await fetch(API+'/vwap?symbol='+encodeURIComponent(s)+'&_='+Date.now(),{cache:'no-store'});
  if(!r.ok)throw Error('HTTP '+r.status);
  var j=await r.json();
  if(j.success&&j.data){draw(Array.isArray(j.data.points)?j.data.points:[]);lastSymbol=s;}
 }catch(e){console.error('[StrikePulse VWAP chart]',e)}
}
function init(){load();setInterval(function(){var s=symbol();if(s!==lastSymbol||s)load()},30000)}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});else init();
})();
'''
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server.js strike-pulse.js
          git diff --cached --quiet || git commit -m "fix: add symbol-wise VWAP chart support"
          git push
